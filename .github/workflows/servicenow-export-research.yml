name: ServiceNowリサーチデータのエクスポート(PTD-058)

# u_ai_research_itemテーブルの全件を data/research-items.json へエクスポート・マージする。
# 既存の日本語要約(summaryJa等)は上書きしない。認証情報はSecrets経由(servicenow-setup.ymlと共通)。
on:
  workflow_dispatch: {}
  schedule:
    # 毎日09:30 JST(00:30 UTC)。AI技術リサーチRoutine(progress-tracker-dashboard側)や
    # ServiceNowのScheduled Job(日次)の後に、その日の新着分も含めて反映されるタイミング。
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  export-research-items:
    name: research-items.jsonへエクスポート
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node servicenow/scripts/export_research_items.mjs
        env:
          SN_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE_URL }}
          SN_CLIENT_ID: ${{ secrets.SERVICENOW_CLIENT_ID }}
          SN_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
      - name: Commit and push if changed
        run: |
          # 新規ファイル(未追跡)は `git diff` に出ないため、先にaddしてから
          # インデックスとの差分(--cached)で判定する(git diff単体だと初回実行時に
          # 「変化なし」と誤判定してコミットがスキップされるバグがあった、2026-09-02発見)。
          git add data/research-items.json
          if git diff --cached --quiet; then
            echo "変化なし、コミットをスキップします"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update research-items.json via servicenow-export-research workflow"
          # 2026-10-11追加: GitHub Push Protectionがシークレットらしき文字列を検知してpushを
          # 拒否した場合に備えた恒久的な安全網。2026-09-28〜10-11、HNのAsk HN投稿内に含まれていた
          # 実在しそうなOpenAI APIキー(sk-svcacct-形式)がpushを14回連続でブロックした実例があり、
          # export_research_items.mjs側にredactSecrets()を追加して対処済みだが、今後
          # SECRET_PATTERNSでカバーしていない別の形式のキーが収集される可能性もあるため、
          # push失敗時はエラーメッセージから実際の行番号を読み取り、該当行をその場で
          # 表示できるようにしておく(経緯はprogress-tracker-dashboardのtasks.json PTD-058参照)。
          if ! git push 2> push_error.log; then
            cat push_error.log
            LINE=$(grep -oP 'data/research-items\.json:\K[0-9]+' push_error.log | head -1)
            if [ -n "$LINE" ]; then
              echo "=== push protectionが検知した行(${LINE}行目)の前後を表示 ==="
              sed -n "$((LINE-5)),$((LINE+3))p" data/research-items.json
            else
              echo "行番号をエラーメッセージから抽出できなかった"
            fi
            exit 1
          fi
