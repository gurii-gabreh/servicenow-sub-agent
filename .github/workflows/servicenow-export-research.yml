name: ServiceNowリサーチデータのエクスポート(PTD-058)

# u_ai_research_itemテーブルの全件を data/research-items.json へエクスポート・マージする。
# 既存の日本語要約(summaryJa等)は上書きしない。認証情報はSecrets経由(servicenow-setup.ymlと共通)。
on:
  workflow_dispatch: {}
  schedule:
    # 毎日09:30 JST(00:30 UTC)。AI技術リサーチRoutine(progress-tracker-dashboard側)や
    # ServiceNowのScheduled Job(日次)の後に、その日の新着分も含めて反映されるタイミング。
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  export-research-items:
    name: research-items.jsonへエクスポート
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node servicenow/scripts/export_research_items.mjs
        env:
          SN_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE_URL }}
          SN_CLIENT_ID: ${{ secrets.SERVICENOW_CLIENT_ID }}
          SN_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
      # 2026-10-11追加(調査用、一時的): 2026-09-28以降、GitHub Push Protectionが
      # data/research-items.json内の文字列を「OpenAI API Key」と誤検知してpushが
      # 拒否され続けている(13回連続失敗)。push失敗時は内容を誰も確認できないため、
      # push成否に関わらず生成直後のJSONをアーティファクトとして保存し、原因調査
      # できるようにする。原因箇所を特定・対処した後にこのステップは削除してよい。
      - name: Upload research-items.json as artifact (調査用)
        uses: actions/upload-artifact@v4
        with:
          name: research-items-json
          path: data/research-items.json
          retention-days: 3
      # 2026-10-11追加(調査用、一時的): アーティファクトのダウンロード経路(Azure Blob)が
      # 調査環境のネットワーク制限で使えなかったため、ジョブログへ直接出力する手段も追加。
      # OpenAI形式のAPIキーらしき文字列(sk-で始まる20文字以上の英数字)を検索し、該当行の
      # 周辺(タイトル・出典URL等)と、値自体はマスクして(先頭6文字+...+末尾4文字)出力する
      # (実際に有効な鍵だった場合にログへ生で残さないため)。原因箇所特定後は削除してよい。
      - name: Grep for suspicious key-like strings (調査用)
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("data/research-items.json", "utf8");
            const lines = text.split("\n");
            const re = /sk-[A-Za-z0-9]{20,}/g;
            let found = 0;
            lines.forEach((line, i) => {
              let m;
              while ((m = re.exec(line)) !== null) {
                found++;
                const val = m[0];
                const masked = val.length > 10 ? val.slice(0,6) + "..." + val.slice(-4) : "(short)";
                console.log(`[MATCH] line ${i+1}: masked=${masked} length=${val.length}`);
                console.log(`  context: ${lines.slice(Math.max(0,i-3), i+2).join(" | ").slice(0,500)}`);
              }
            });
            console.log(`合計 ${found} 件の一致`);
            if (found === 0) console.log("sk-パターンには一致しなかった。別のパターンの可能性あり(行12218周辺を別途確認要)。");
            console.log("--- 行12210〜12226(参考、該当行周辺をそのまま表示) ---");
            lines.slice(12209, 12226).forEach((l, idx) => console.log(`${12210+idx}: ${l}`));
          '
      - name: Commit and push if changed
        run: |
          # 新規ファイル(未追跡)は `git diff` に出ないため、先にaddしてから
          # インデックスとの差分(--cached)で判定する(git diff単体だと初回実行時に
          # 「変化なし」と誤判定してコミットがスキップされるバグがあった、2026-09-02発見)。
          git add data/research-items.json
          if git diff --cached --quiet; then
            echo "変化なし、コミットをスキップします"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update research-items.json via servicenow-export-research workflow"
          git push
