name: ServiceNowセットアップ・同期(PTD-048/049)

# 手動実行専用(workflow_dispatch)。ServiceNow OAuth Application RegistryのClient ID/Secretと
# インスタンスURLを、リポジトリのSettings > Secrets and variables > Actionsに
# SERVICENOW_INSTANCE_URL / SERVICENOW_CLIENT_ID / SERVICENOW_CLIENT_SECRET として
# 登録した上で実行すること。SERVICENOW_INSTANCE_URLは "dev395932.service-now.com" のような
# ホスト名でも "https://dev395932.service-now.com" のような完全なURLでもどちらでもよい
# (lib/servicenow_client.mjs側で正規化する)。手順の詳細はREADME.md「セットアップ手順」参照。
#
# PTD-089(YouTube Data API v3)を使う場合は、追加でYOUTUBE_API_KEYも同じ場所に登録すること。
# 未登録でもワークフロー自体は失敗せず、setup-youtube-api-keyジョブがスキップのログを
# 出すだけで、他のジョブには影響しない。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true=実際には作成せずログ出力のみ(初回はtrue推奨)"
        type: boolean
        default: true

jobs:
  verify-source-urls:
    name: 情報源URLの実地検証(PTD-050関連、認証不要)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node servicenow/scripts/verify_source_urls.mjs

  setup-rest-messages:
    name: REST Message自動作成(PTD-048)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node servicenow/scripts/setup_rest_messages.mjs
        env:
          SN_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE_URL }}
          SN_CLIENT_ID: ${{ secrets.SERVICENOW_CLIENT_ID }}
          SN_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}

  setup-youtube-api-key:
    name: YouTube APIキーをシステムプロパティへ設定(PTD-089)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node servicenow/scripts/setup_youtube_api_key.mjs
        env:
          SN_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE_URL }}
          SN_CLIENT_ID: ${{ secrets.SERVICENOW_CLIENT_ID }}
          SN_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}

  sync-scheduled-job:
    name: Scheduled Jobスクリプト同期(PTD-049)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node servicenow/scripts/sync_scheduled_job.mjs
        env:
          SN_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE_URL }}
          SN_CLIENT_ID: ${{ secrets.SERVICENOW_CLIENT_ID }}
          SN_CLIENT_SECRET: ${{ secrets.SERVICENOW_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
