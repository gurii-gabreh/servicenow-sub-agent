name: 一時診断: Anthropic newsページのHTML構造確認(PTD-046拡張)

# 使い捨てワークフロー。servicenow/scripts/tmp_inspect_anthropic_news.mjsの実行専用。
# 実際のタグ構造を確認できたら、このファイルとスクリプトの両方を削除すること。
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node servicenow/scripts/tmp_inspect_anthropic_news.mjs
